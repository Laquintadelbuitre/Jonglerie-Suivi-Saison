<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contrat Jonglage U13 — Limoges Football</title>
<style>
  :root{
    --bronze:#a86a3d;
    --bronze-fond:rgba(168,106,61,.16);
    --argent:#9aa0ab;
    --argent-fond:rgba(154,160,171,.16);
    --or:#d4a82e;
    --or-fond:rgba(212,168,46,.16);
    --platine:#7fd4e8;
    --platine-fond:rgba(127,212,232,.16);
    --fond:#0f1115;
    --panneau:#1a1d24;
    --panneau-clair:#22262f;
    --texte:#eef0f3;
    --texte-att:#9aa0ad;
    --ligne:#2c303a;
    --bleu:#4a7dd6;
    --vert-ok:#3a9d5a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--fond);
    color:var(--texte);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto;padding:20px 18px 60px;}

  .header{text-align:center;margin-bottom:22px;padding-top:6px;}
  .header img{width:64px;height:64px;margin-bottom:10px;}
  .header h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .header p{font-size:13.5px;color:var(--texte-att);margin:0;}

  .panneau{background:var(--panneau);border:1px solid var(--ligne);border-radius:18px;padding:20px;}

  .champ-nom{margin-bottom:14px;}
  .champ-nom label{display:block;font-size:13px;color:var(--texte-att);margin-bottom:8px;}
  .champ-nom select{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--ligne);
    background:var(--panneau-clair);color:var(--texte);font-size:16px;appearance:none;
  }
  .champ-nom select:focus{outline:2px solid var(--bleu);}

  .champ-code{margin-top:12px;}
  .champ-code input{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--ligne);
    background:var(--panneau-clair);color:var(--texte);font-size:18px;letter-spacing:0.3em;
    text-align:center;
  }
  .champ-code input:focus{outline:2px solid var(--bleu);}
  .champ-code label{display:block;font-size:13px;color:var(--texte-att);margin-bottom:8px;}

  .btn-entrer{
    margin-top:16px;width:100%;padding:14px;border-radius:14px;border:none;
    background:var(--bleu);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn-entrer:disabled{background:#3a3e48;color:#7a7e88;cursor:not-allowed;}

  .erreur-code{
    display:none;margin-top:12px;background:rgba(196,57,47,.12);border:1px solid rgba(196,57,47,.4);
    color:#e8a39d;font-size:13px;padding:10px 12px;border-radius:10px;
  }

  /* ---- ECRAN PROGRESSION ---- */
  .ecran-jeu{display:none;}

  .barre-joueur{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  }
  .barre-joueur .nom-joueur{font-size:16px;font-weight:700;}
  .barre-joueur .deconnexion{
    background:none;border:1px solid var(--ligne);color:var(--texte-att);font-size:12px;
    padding:7px 12px;border-radius:999px;cursor:pointer;
  }

  .paliers-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .palier-tab{
    flex:1;text-align:center;padding:10px 4px;border-radius:12px;border:1.5px solid var(--ligne);
    background:var(--panneau-clair);cursor:pointer;font-size:12.5px;font-weight:700;
    color:var(--texte-att);position:relative;
  }
  .palier-tab.actif{color:var(--texte);}
  .palier-tab.locked{opacity:.4;cursor:not-allowed;}
  .palier-tab .cadenas{font-size:11px;margin-left:3px;}
  .palier-tab.tab-bronze.actif{border-color:var(--bronze); background:var(--bronze-fond);}
  .palier-tab.tab-argent.actif{border-color:var(--argent); background:var(--argent-fond);}
  .palier-tab.tab-or.actif{border-color:var(--or); background:var(--or-fond);}
  .palier-tab.tab-platine.actif{border-color:var(--platine); background:var(--platine-fond);}

  .progress-bar-zone{margin-bottom:18px;}
  .progress-bar-track{
    height:10px;border-radius:999px;background:var(--panneau-clair);overflow:hidden;border:1px solid var(--ligne);
  }
  .progress-bar-fill{height:100%;border-radius:999px;transition:width .3s ease;}
  .progress-bar-fill.bronze{background:var(--bronze);}
  .progress-bar-fill.argent{background:var(--argent);}
  .progress-bar-fill.or{background:var(--or);}
  .progress-bar-fill.platine{background:var(--platine);}
  .progress-bar-label{font-size:12px;color:var(--texte-att);margin-top:6px;text-align:center;}

  .niveau-ligne{
    display:flex;align-items:center;gap:12px;background:var(--panneau-clair);border:1px solid var(--ligne);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;
  }
  .niveau-ligne.fait{border-color:var(--vert-ok); background:rgba(58,157,90,.08);}
  .niveau-ligne .num{
    width:26px;height:26px;border-radius:50%;background:var(--panneau);border:1px solid var(--ligne);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--texte-att);
    flex-shrink:0;
  }
  .niveau-ligne.fait .num{background:var(--vert-ok); border-color:var(--vert-ok); color:#fff;}
  .niveau-ligne .desc{flex:1;font-size:13.5px;line-height:1.4;}
  .niveau-ligne .case{
    width:26px;height:26px;border-radius:8px;border:2px solid var(--ligne);flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;
    background:var(--panneau);
  }
  .niveau-ligne.fait .case{background:var(--vert-ok); border-color:var(--vert-ok); color:#fff;}

  .palier-complet{
    text-align:center;padding:24px 16px;border:1.5px dashed var(--ligne);border-radius:16px;margin-top:6px;
  }
  .palier-complet .emoji{font-size:36px;display:block;margin-bottom:10px;}
  .palier-complet p{margin:0;font-size:14px;color:var(--texte-att);}

  .palier-verrouille{
    text-align:center;padding:30px 16px;color:var(--texte-att);font-size:14px;
  }

  .toggle-zone{margin-top:26px;text-align:center;}
  .toggle-btn{background:none;border:1px solid var(--ligne);color:var(--texte-att);font-size:13px;padding:9px 18px;border-radius:999px;cursor:pointer;}

  .dashboard{display:none;margin-top:22px;}
  .dashboard.show{display:block;}
  .dash-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .dash-head h2{font-size:16px;margin:0;}

  .joueur-card{
    background:var(--panneau);border:1px solid var(--ligne);border-radius:14px;padding:14px;margin-bottom:10px;
  }
  .joueur-card .nom{font-size:14.5px;font-weight:700;margin-bottom:8px;}
  .joueur-card .ligne-palier{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
  .joueur-card .ligne-palier .etiquette{width:56px;color:var(--texte-att);flex-shrink:0;}
  .joueur-card .mini-track{flex:1;height:7px;border-radius:999px;background:var(--panneau-clair);overflow:hidden;}
  .joueur-card .mini-fill{height:100%;border-radius:999px;}
  .joueur-card .mini-fill.bronze{background:var(--bronze);}
  .joueur-card .mini-fill.argent{background:var(--argent);}
  .joueur-card .mini-fill.or{background:var(--or);}
  .joueur-card .mini-fill.platine{background:var(--platine);}
  .joueur-card .chiffre{width:36px;text-align:right;color:var(--texte-att);flex-shrink:0;}

  .dash-actions{display:flex;gap:10px;margin-top:14px;}
  .dash-actions button{flex:1;background:var(--panneau);border:1px solid var(--ligne);color:var(--texte-att);padding:10px;border-radius:10px;font-size:13px;cursor:pointer;}

  .dash-loading{text-align:center;color:var(--texte-att);font-size:13px;padding:24px;}

  .footer-note{text-align:center;color:var(--texte-att);font-size:11.5px;margin-top:26px;line-height:1.5;}
</style>
</head>

    <div class="champ-code">
      <label for="inputCode">Ton code à 4 chiffres</label>
      <input type="tel" inputmode="numeric" maxlength="4" id="inputCode" placeholder="••••">
    </div>
    <button class="btn-entrer" id="btnEntrer" disabled>Accéder à mon contrat</button>
    <div class="erreur-code" id="erreurCode">Code incorrect. Demande-le à ton coach.</div>
  </div>

  <!-- ECRAN JEU -->
  <div class="ecran-jeu" id="ecranJeu">
    <div class="barre-joueur">
      <span class="nom-joueur" id="nomJoueurAffiche"></span>
      <button class="deconnexion" id="btnDeconnexion">Changer de joueur</button>
    </div>

    <div class="paliers-tabs" id="paliersTabs"></div>

    <div class="progress-bar-zone">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-bar-label" id="progressLabel"></div>
    </div>

    <div id="contenuPalier"></div>
  </div>

  <div class="toggle-zone">
    <button class="toggle-btn" id="btnToggleDash">Voir le tableau de bord coach</button>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="dash-head">
      <h2>Progression de l'équipe</h2>
    </div>
    <div id="dashContenu"><div class="dash-loading">Chargement…</div></div>
    <div class="dash-actions">
      <button id="btnRafraichirDash">Actualiser</button>
    </div>
  </div>

  <div class="footer-note">
    Règle : réussir 2 fois un palier avant de passer au suivant.<br>
    Ta progression est sauvegardée automatiquement et visible par ton coach.
  </div>

</div>

<script src="app.min.js"></script>
</body>
</html>
